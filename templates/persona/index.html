<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{name}} - Persona</title>

    <link rel="stylesheet" href="persona.css">

    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            min-height: 297mm;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }

        .persona {
            width: 210mm;
            min-height: 297mm;
            padding: 18mm;
            display: grid;
            grid-template-columns: 35% 65%;
            gap: 12mm;
            background: #ffffff;
        }

        /* =========================
           CỘT BÊN TRÁI
           ========================= */

        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .photo {
            width: 55mm;
            height: 55mm;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 8mm;
        }

        .left h1 {
            margin: 0 0 3mm 0;
            font-size: 26px;
            line-height: 1.2;
        }

        .occupation {
            margin: 0 0 8mm 0;
            font-size: 15px;
            font-weight: normal;
        }

        .background {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
            text-align: left;
        }

        /* =========================
           CỘT BÊN PHẢI
           ========================= */

        .right {
            display: flex;
            flex-direction: column;
        }

        .section {
            margin-bottom: 7mm;
        }

        .section h2 {
            margin: 0 0 3mm 0;
            font-size: 18px;
            line-height: 1.3;
        }

        .section ul {
            margin: 0;
            padding-left: 6mm;
        }

        .section li {
            margin-bottom: 2mm;
            font-size: 13px;
            line-height: 1.5;
        }

        blockquote {
            margin: 0;
            padding: 4mm 5mm;
            border-left: 3px solid #333333;
            font-size: 14px;
            line-height: 1.6;
            font-style: italic;
        }

        /* Tránh việc một section bị chia đôi khi render PDF */
        .section {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    </style>
</head>

<body>

    <main class="persona">

        <!-- CỘT BÊN TRÁI -->
        <aside class="left">

            <img class="photo" src="{{photo}}" alt="Ảnh của {{name}}">

            <h1>{{name}}</h1>

            <p class="occupation">
                {{occupation}}
            </p>

            <p class="background">
                {{background}}
            </p>

        </aside>


        <!-- CỘT BÊN PHẢI -->
        <section class="right">

            <!-- Mục tiêu -->
            <div class="section">
                <h2>Goals</h2>
                <ul>
                    {{goals}}
                </ul>
            </div>

            <!-- Nhiệm vụ -->
            <div class="section">
                <h2>Tasks</h2>
                <ul>
                    {{tasks}}
                </ul>
            </div>

            <!-- Điểm đau -->
            <div class="section">
                <h2>Pain Points</h2>
                <ul>
                    {{pain_points}}
                </ul>
            </div>

            <!-- Mong muốn -->
            <div class="section">
                <h2>Wishes</h2>
                <ul>
                    {{wishes}}
                </ul>
            </div>

            <!-- Hành vi -->
            <div class="section">
                <h2>Behaviors</h2>
                <ul>
                    {{behaviors}}
                </ul>
            </div>

            <!-- Trích dẫn -->
            <div class="section">
                <h2>Quote</h2>
                <blockquote>
                    {{quote}}
                </blockquote>
            </div>

        </section>

    </main>

</body>

</html>
