<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{name}} - Persona</title>

    <link rel="stylesheet" href="persona.css">

    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 210mm;
            height: 297mm;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
        }

        .persona {
            width: 210mm;
            height: 297mm;
            padding: 12mm 14mm;
            display: grid;
            grid-template-columns: 38% 62%;
            gap: 8mm;
            background: #ffffff;
            overflow: hidden;
        }

        /* =========================
           CỘT BÊN TRÁI
           ========================= */

        .left {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .photo {
            width: 44mm;
            height: 44mm;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 3mm auto;
            display: block;
        }

        .left h1 {
            margin: 0 0 1.5mm 0;
            font-size: 21px;
            line-height: 1.2;
            text-align: center;
        }

        .occupation {
            margin: 0 0 3.5mm 0;
            font-size: 13px;
            font-weight: normal;
            text-align: center;
            color: #475569;
        }

        .background {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            text-align: left;
        }

        /* =========================
           CỘT BÊN PHẢI
           ========================= */

        .right {
            display: flex;
            flex-direction: column;
        }

        .section {
            margin-bottom: 4mm;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .section h2 {
            margin: 0 0 1.8mm 0;
            font-size: 15px;
            line-height: 1.25;
        }

        .section ul {
            margin: 0;
            padding-left: 5mm;
        }

        .section li {
            margin-bottom: 1.2mm;
            font-size: 11.8px;
            line-height: 1.4;
        }

        blockquote {
            margin: 0;
            padding: 2.5mm 3.5mm;
            border-left: 3px solid #333333;
            font-size: 12px;
            line-height: 1.45;
            font-style: italic;
            background: #f8fafc;
        }
    </style>
</head>

<body>

    <main class="persona">

        <!-- CỘT BÊN TRÁI -->
        <aside class="left">

            <img class="photo" src="{{photo}}" alt="Ảnh của {{name}}">

            <h1>{{name}}</h1>

            <p class="occupation">
                {{occupation}}
            </p>

            <!-- Bối cảnh -->
            <div class="section">
                <h2>Background</h2>
                <p class="background">
                    {{background}}
                </p>
            </div>

            <!-- Nhân khẩu học -->
            <div class="section">
                <h2>Demographics</h2>
                <ul>
                    {{demographics}}
                </ul>
            </div>

            <!-- Thẻ phân loại -->
            <div class="section">
                <h2>Tags</h2>
                <ul>
                    {{tags}}
                </ul>
            </div>

            <!-- Trích dẫn -->
            <div class="section">
                <h2>Quote</h2>
                <blockquote>
                    {{quote}}
                </blockquote>
            </div>

        </aside>


        <!-- CỘT BÊN PHẢI -->
        <section class="right">

            <!-- Mục tiêu -->
            <div class="section">
                <h2>Goals</h2>
                <ul>
                    {{goals}}
                </ul>
            </div>

            <!-- Nhiệm vụ -->
            <div class="section">
                <h2>Tasks</h2>
                <ul>
                    {{tasks}}
                </ul>
            </div>

            <!-- Điểm chạm -->
            <div class="section">
                <h2>Touch Points</h2>
                <ul>
                    {{touch_points}}
                </ul>
            </div>

            <!-- Điểm đau -->
            <div class="section">
                <h2>Pain Points</h2>
                <ul>
                    {{pain_points}}
                </ul>
            </div>

            <!-- Mong muốn -->
            <div class="section">
                <h2>Wishes</h2>
                <ul>
                    {{wishes}}
                </ul>
            </div>

            <!-- Hành vi -->
            <div class="section">
                <h2>Behaviors</h2>
                <ul>
                    {{behaviors}}
                </ul>
            </div>

        </section>

    </main>

</body>

</html>
